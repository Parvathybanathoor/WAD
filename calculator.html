<!DOCTYPE html>
<html>
<head>
    <title>Marks Calculator</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
            padding: 40px;
        }

        .box {
            width: 350px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 85%;
            padding: 10px;
            margin: 7px;
            border: 1px solid gray;
            border-radius: 5px;
        }

        button {
            padding: 10px 25px;
            margin-top: 15px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: gray;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #eee;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>Marks Calculator</h2>

        <input type="number" id="mark1" placeholder="Enter Mark 1">
        <input type="number" id="mark2" placeholder="Enter Mark 2">
        <input type="number" id="mark3" placeholder="Enter Mark 3">
        <input type="number" id="mark4" placeholder="Enter Mark 4">
        <input type="number" id="mark5" placeholder="Enter Mark 5">

        <br>

        <button onclick="calculate()">Calculate</button>
        <button onclick="clearData()">Clear</button>

        <div id="result"></div>

    </div>


    <script>

        function calculate() {

            // Create an array of 5 marks
            let marks = [
                Number(document.getElementById("mark1").value),
                Number(document.getElementById("mark2").value),
                Number(document.getElementById("mark3").value),
                Number(document.getElementById("mark4").value),
                Number(document.getElementById("mark5").value)
            ];

            // Calculate total
            let total = 0;

            for (let i = 0; i < marks.length; i++) {
                total = total + marks[i];
            }

            // Calculate average
            let average = total / marks.length;

            // Display result
            document.getElementById("result").innerHTML =
                "<h3>Result</h3>" +
                "<p>Marks: " + marks.join(", ") + "</p>" +
                "<p><b>Total:</b> " + total + "</p>" +
                "<p><b>Average:</b> " + average.toFixed(2) + "</p>";
        }


        // Clear button
        function clearData() {

            document.getElementById("mark1").value = "";
            document.getElementById("mark2").value = "";
            document.getElementById("mark3").value = "";
            document.getElementById("mark4").value = "";
            document.getElementById("mark5").value = "";

            document.getElementById("result").innerHTML = "";
        }

    </script>

</body>
</html>
